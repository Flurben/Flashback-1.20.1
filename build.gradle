plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/flashback120.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Dear ImGui (MIT) for the editor and export windows, bundled in the jar
    include(implementation("io.github.spair:imgui-java-binding:${project.imgui_version}"))
    include(implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") { transitive = false })
    include(runtimeOnly("io.github.spair:imgui-java-natives-windows:${project.imgui_version}"))
    include(runtimeOnly("io.github.spair:imgui-java-natives-linux:${project.imgui_version}"))
    include(runtimeOnly("io.github.spair:imgui-java-natives-macos:${project.imgui_version}"))

    // Optional integrations
    modCompileOnly("maven.modrinth:modmenu:7.2.2")
    modCompileOnly("maven.modrinth:sodium:mc1.20.1-0.5.13-fabric")
    modCompileOnly("maven.modrinth:iris:1.7.6+1.20.1")

    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
